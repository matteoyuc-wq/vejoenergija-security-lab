name: VejoEnergija Security CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: "1 Secrets - quality gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan current source for credentials
        run: python3 ci/check_secrets.py

  sca:
    name: "2 SCA - dependencies"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report vulnerable dependencies
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r requirements.txt || true
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.2
      - name: Critical dependency quality gate
        run: trivy fs --scanners vuln --severity CRITICAL --exit-code 1 requirements.txt

  sast:
    name: "3 SAST - source code"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan Python with Bandit (findings are warnings)
        run: |
          python -m pip install --quiet bandit
          bandit -r . -x ./ci,./tests -f txt || true

  container:
    name: "4 Container - Critical gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build hardened image
        run: docker build -f Dockerfile.hardened -t vejo-ci:hardened .
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.2
      - name: Scan all image vulnerabilities (report only)
        run: trivy image --scanners vuln --severity HIGH,MEDIUM,LOW --exit-code 0 vejo-ci:hardened
      - name: Fail on Critical image vulnerabilities
        run: trivy image --scanners vuln --severity CRITICAL --exit-code 1 vejo-ci:hardened

  iac:
    name: "5 IaC - Checkov"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check hardened Dockerfile (findings are warnings)
        run: |
          python3 -m pip install --quiet checkov
          checkov -f Dockerfile.hardened --framework dockerfile --soft-fail

  build_sbom:
    name: "6 Build, smoke test and SBOM"
    runs-on: ubuntu-latest
    needs: [secrets, sca, sast, container, iac]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run application tests
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Build image
        run: docker build -f Dockerfile.hardened -t vejo-ci:release .
      - name: Simulated deployment and health check
        run: |
          docker run -d --name vejo-ci-test -p 127.0.0.1:18000:8000 --read-only --cap-drop=ALL --security-opt=no-new-privileges:true vejo-ci:release
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18000/health; then
              echo "Deployment health check passed"
              exit 0
            fi
            sleep 1
          done
          docker logs vejo-ci-test
          exit 1
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.2
      - name: Generate CycloneDX SBOM
        run: trivy image --format cyclonedx --output sbom.cdx.json vejo-ci:release
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: vejoenergija-sbom
          path: sbom.cdx.json
